seed: 42

data:
  root: "D:/zzr/data/visdrone/processed"
  clip_len: 8          # 输入帧数 T_in
  pred_len: 5          # 预测步数 T_out
  stride: 6            # 30fps 抽到 5fps。stride 2 时相邻帧余弦 0.936，
                       # 预测退化成恒等映射（实测 pred loss 0.03），必须拉开间隔
  img_w: 192           # 1344×756 的 1/7，零畸变
  img_h: 108
  grid_w: 48           # 占据栅格 = img/4
  grid_h: 27

model:
  patch: 6             # 目标中位边长 7.5 px（192 宽），patch 必须 ≤6 才有意义
                       # 192/6=32, 108/6=18 → 每帧 576 个 token
  dim: 256
  depth: 10
  heads: 4
  mlp_ratio: 4
  pred_depth: 6
  ema_tau: 0.996
  vicreg_var: 0.15     # 预测损失会降到 0.03 量级，0.04 的正则压不住坍缩
  vicreg_cov: 0.01

train:
  batch: 1             # 大模型下 8 GB 只够 batch 1，用梯度累积补
  grad_accum: 9        # 有效 batch 9，与原配置一致，保证可比
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 3
  steps_per_epoch: 600
  epochs: 20
  amp: bf16
  grad_clip: 1.0

eval:
  horizons: [1, 2, 3, 4, 5]
